<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoodleUz - Content Manager</title>
    
    <!-- 使用 netlify-cms 2.x (稳定版，全局变量为 NetlifyCMS) -->
    <script src="https://cdn.jsdelivr.net/npm/netlify-cms@2.10.192/dist/netlify-cms.js"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #cms-error {
            display: none;
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            background: #fff5f5;
            border-left: 4px solid #e85d04;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #cms-error h2 { color: #e85d04; margin-top: 0; }
        #cms-error code { background: #f5f5f5; padding: 2px 6px; font-size: 13px; }
    </style>
</head>
<body>

<div id="cms-error">
    <h2>⚠️ CMS 加载失败</h2>
    <p>请确认以下步骤已完成：</p>
    <ol>
        <li>Netlify 后台 → Site Settings → Identity → <strong>Enable Identity</strong></li>
        <li>Identity 页面 → Services → <strong>Git Gateway → Enable</strong></li>
        <li>Registration 设为 <strong>"Invite only"</strong></li>
        <li><a href="https://docs.netlify.com/visitor-access/identity/" target="_blank">Netlify Identity 官方文档</a></li>
    </ol>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
    // 检查所有可能的全局变量名
    var CMS = window.CMS || window.DecapCMS || window.NetlifyCMS || window.netlifyCms;

    console.log('Checking globals:', {
        'window.CMS': typeof window.CMS,
        'window.DecapCMS': typeof window.DecapCMS,
        'window.NetlifyCMS': typeof window.NetlifyCMS,
        'window.netlifyCms': typeof window.netlifyCms
    });

    if (CMS) {
        try {
            CMS.init();
            console.log('CMS.init() succeeded');
        } catch(e) {
            document.getElementById('cms-error').style.display = 'block';
            console.error('CMS.init() error:', e);
        }
    } else {
        document.getElementById('cms-error').style.display = 'block';
        console.error('No CMS global object found');
    }

    // Identity 重定向
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
            if (!user) {
                window.netlifyIdentity.on("login", function() {
                    document.location.href = "/admin/";
                });
            }
        });
    }
</script>
</body>
</html>
