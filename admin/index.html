<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoodleUz - Content Manager</title>
    
    <!-- Decap CMS - 使用 jsdelivr CDN + 稳定版本 -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.0/dist/decap-cms.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #cms-error {
            display: none;
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            background: #fff5f5;
            border-left: 4px solid #e85d04;
        }
        #cms-error h2 { color: #e85d04; margin-top: 0; }
        #cms-error pre { background: #f5f5f5; padding: 12px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>

<div id="cms-error">
    <h2>⚠️ CMS 加载失败</h2>
    <p>Decap CMS 未能正确初始化，可能原因：</p>
    <ul>
        <li>Netlify Identity 未启用（请到 Netlify 后台启用）</li>
        <li>Git Gateway 未启用</li>
        <li>网络连接问题</li>
    </ul>
    <p><strong>请检查浏览器控制台的详细错误信息。</strong></p>
    <p>部署指南请参考：<code>DEPLOYMENT.md</code></p>
</div>

<!-- Netlify Identity Widget (必须在 decap-cms.js 之后) -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
    // 检查 CMS 是否加载成功
    var CMS = window.CMS || window.DecapCMS || window.netlifyCms;

    if (!CMS) {
        document.getElementById('cms-error').style.display = 'block';
        console.error('Decap CMS global object not found. Available globals:', Object.keys(window).filter(function(k) { return k.toLowerCase().indexOf('cms') > -1 || k.toLowerCase().indexOf('netlify') > -1; }));
    } else {
        console.log('CMS loaded:', CMS);
        
        try {
            CMS.init({
                config: {
                    backend: {
                        name: 'git-gateway',
                        branch: 'main'
                    },
                    media_folder: 'assets/images',
                    public_folder: '/assets/images',
                    collections: []
                }
            });
        } catch(e) {
            document.getElementById('cms-error').style.display = 'block';
            console.error('CMS.init() error:', e);
        }
    }

    // Identity 登录后重定向回 /admin/
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
            if (!user) {
                window.netlifyIdentity.on("login", function() {
                    document.location.href = "/admin/";
                });
            }
        });
    }
</script>
</body>
</html>
