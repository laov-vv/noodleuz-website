<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoodleUz - Content Manager</title>
    
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.1.0/dist/decap-cms.js"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        /* 隐藏加载闪烁 */
        [data-cms-ui] { opacity: 0; }
        [data-cms-ui].loaded { opacity: 1; }
    </style>
</head>
<body>
    <!-- Netlify Identity Widget (必须在 decap-cms.js 之后) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        // Identity 登录后重定向回 /admin/
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", function(user) {
                if (!user) {
                    window.netlifyIdentity.on("login", function() {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        // 初始化 CMS
        var CMS = window.CMS || window.DecapCMS;
        if (CMS) {
            CMS.init();
        } else {
            console.error('Decap CMS not loaded');
            document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#e85d04"><h2>⚠️ CMS 加载失败</h2><p>请检查网络连接或刷新页面重试</p></div>';
        }
    </script>
</body>
</html>
