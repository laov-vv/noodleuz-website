backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # ========== 1. HERO / BANNER 板块 ==========
  - name: "hero_section"
    label: "Hero Banner"
    label_singular: "Hero Banner"
    files:
      - name: "hero_content"
        label: "Hero Content"
        file: "content/sections/hero.json"
        fields:
          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Banner右侧主图（建议尺寸 800x600px）"
          - label: "Badge Text (EN)"
            name: "badge_en"
            widget: "string"
            default: "HALAL Certified"
          - label: "Badge Text (UZ)"
            name: "badge_uz"
            widget: "string"
            default: "HALAL sertifikati"
          - label: "Badge Text (RU)"
            name: "badge_ru"
            widget: "string"
            default: "Сертификат HALAL"
          - label: "Title (EN)"
            name: "title_en"
            widget: "text"
            default: "Premium Noodle<br><span>Manufacturer</span> in Uzbekistan"
          - label: "Title (UZ)"
            name: "title_uz"
            widget: "text"
            default: "O'zbekistonda<br><span>sifatli la'mon</span> ishlab chiqaruvchisi"
          - label: "Title (RU)"
            name: "title_ru"
            widget: "text"
            default: "Производитель<br><span>качественной лапши</span> в Узбекистане"
          - label: "Description (EN)"
            name: "desc_en"
            widget: "text"
            default: "We produce high-quality instant noodles using premium ingredients and advanced technology, providing safe and delicious food solutions for the Central Asian market."
          - label: "Description (UZ)"
            name: "desc_uz"
            widget: "text"
            default: "Biz yuqori sifatli tez tayyorlanadigan la'mon ishlab chiqaramiz."
          - label: "Description (RU)"
            name: "desc_ru"
            widget: "text"
            default: "Мы производим высококачественную лапшу быстрого приготовления."
          - label: "Button 1 Text (EN)"
            name: "btn1_en"
            widget: "string"
            default: "View Products"
          - label: "Button 1 Text (UZ)"
            name: "btn1_uz"
            widget: "string"
            default: "Mahsulotlarni ko'rish"
          - label: "Button 1 Text (RU)"
            name: "btn1_ru"
            widget: "string"
            default: "Смотреть продукцию"
          - label: "Button 2 Text (EN)"
            name: "btn2_en"
            widget: "string"
            default: "Become a Distributor"
          - label: "Button 2 Text (UZ)"
            name: "btn2_uz"
            widget: "string"
            default: "Distributorga aylaning"
          - label: "Button 2 Text (RU)"
            name: "btn2_ru"
            widget: "string"
            default: "Стать дистрибьютором"
          - label: "Stat 1 Number"
            name: "stat1_num"
            widget: "string"
            default: "15+"
          - label: "Stat 1 Label (EN)"
            name: "stat1_label_en"
            widget: "string"
            default: "Product Varieties"
          - label: "Stat 2 Number"
            name: "stat2_num"
            widget: "string"
            default: "50K+"
          - label: "Stat 2 Label (EN)"
            name: "stat2_label_en"
            widget: "string"
            default: "Daily Capacity (boxes)"
          - label: "Stat 3 Number"
            name: "stat3_num"
            widget: "string"
            default: "8"
          - label: "Stat 3 Label (EN)"
            name: "stat3_label_en"
            widget: "string"
            default: "Export Countries"
          - label: "Floating Badge 1 Text (EN)"
            name: "fbadge1_en"
            widget: "string"
            default: "Food Safety Certified"
          - label: "Floating Badge 2 Title (EN)"
            name: "fbadge2_title_en"
            widget: "string"
            default: "Natural Ingredients"
          - label: "Floating Badge 2 Text (EN)"
            name: "fbadge2_text_en"
            widget: "string"
            default: "No Additives"
          - label: "Floating Badge 3 Title (EN)"
            name: "fbadge3_title_en"
            widget: "string"
            default: "Global Delivery"
          - label: "Floating Badge 3 Text (EN)"
            name: "fbadge3_text_en"
            widget: "string"
            default: "Export to 8 Countries"

  # ========== 2. NAVIGATION & LOGO ==========
  - name: "navigation"
    label: "Navigation & Logo"
    label_singular: "Navigation"
    files:
      - name: "nav_content"
        label: "Navigation & Logo"
        file: "content/sections/navigation.json"
        fields:
          - label: "Logo Image"
            name: "logo_image"
            widget: "image"
            required: false
            hint: "品牌Logo（建议尺寸 200x60px，透明背景PNG）"
          - label: "Brand Name"
            name: "brand_name"
            widget: "string"
            default: "NoodleUz"
          - label: "Nav: About (EN)"
            name: "nav_about_en"
            widget: "string"
            default: "About Us"
          - label: "Nav: About (UZ)"
            name: "nav_about_uz"
            widget: "string"
            default: "Biz haqimizda"
          - label: "Nav: About (RU)"
            name: "nav_about_ru"
            widget: "string"
            default: "О нас"
          - label: "Nav: Products (EN)"
            name: "nav_products_en"
            widget: "string"
            default: "Products"
          - label: "Nav: Products (UZ)"
            name: "nav_products_uz"
            widget: "string"
            default: "Mahsulotlar"
          - label: "Nav: Products (RU)"
            name: "nav_products_ru"
            widget: "string"
            default: "Продукция"
          - label: "Nav: Quality (EN)"
            name: "nav_quality_en"
            widget: "string"
            default: "Quality"
          - label: "Nav: Quality (UZ)"
            name: "nav_quality_uz"
            widget: "string"
            default: "Sifat"
          - label: "Nav: Quality (RU)"
            name: "nav_quality_ru"
            widget: "string"
            default: "Качество"
          - label: "Nav: B2B (EN)"
            name: "nav_b2b_en"
            widget: "string"
            default: "Partnership"
          - label: "Nav: B2B (UZ)"
            name: "nav_b2b_uz"
            widget: "string"
            default: "Hamkorlik"
          - label: "Nav: B2B (RU)"
            name: "nav_b2b_ru"
            widget: "string"
            default: "Сотрудничество"
          - label: "Nav: Contact (EN)"
            name: "nav_contact_en"
            widget: "string"
            default: "Contact"
          - label: "Nav: Contact (UZ)"
            name: "nav_contact_uz"
            widget: "string"
            default: "Aloqa"
          - label: "Nav: Contact (RU)"
            name: "nav_contact_ru"
            widget: "string"
            default: "Контакты"
          - label: "Nav CTA Button (EN)"
            name: "nav_cta_en"
            widget: "string"
            default: "Get Quote"
          - label: "Nav CTA Button (UZ)"
            name: "nav_cta_uz"
            widget: "string"
            default: "So'rov yuborish"
          - label: "Nav CTA Button (RU)"
            name: "nav_cta_ru"
            widget: "string"
            default: "Получить предложение"

  # ========== 3. ABOUT 板块 ==========
  - name: "about_section"
    label: "About Section"
    label_singular: "About"
    files:
      - name: "about_content"
        label: "About Content"
        file: "content/sections/about.json"
        fields:
          - label: "About Image"
            name: "about_image"
            widget: "image"
            required: false
            hint: "关于我们图片（建议尺寸 600x450px）"
          - label: "Founded Year"
            name: "founded_year"
            widget: "string"
            default: "2018"
          - label: "Established Badge (EN)"
            name: "established_en"
            widget: "string"
            default: "Established"
          - label: "Title (EN)"
            name: "title_en"
            widget: "text"
            default: "Quality Focused, Crafted with Care"
          - label: "Title (UZ)"
            name: "title_uz"
            widget: "text"
            default: "Sifatga e'tiborli, ehtiyotkorlik bilan ishlab chiqarilgan"
          - label: "Title (RU)"
            name: "title_ru"
            widget: "text"
            default: "Внимание к качеству, произведено с заботой"
          - label: "Paragraph 1 (EN)"
            name: "p1_en"
            widget: "text"
            default: "NoodleUz was established in 2018 and is a leading instant noodle manufacturer in Uzbekistan. We have introduced modern production lines and implement international quality management system standards."
          - label: "Paragraph 1 (UZ)"
            name: "p1_uz"
            widget: "text"
            default: "NoodleUz 2018 yilda tashkil etilgan va O'zbekistondagi yetakchi tez tayyorlanadigan la'mon ishlab chiqaruvchisi."
          - label: "Paragraph 1 (RU)"
            name: "p1_ru"
            widget: "text"
            default: "NoodleUz была основана в 2018 году и является ведущим производителем лапши быстрого приготовления в Узбекистане."
          - label: "Paragraph 2 (EN)"
            name: "p2_en"
            widget: "text"
            default: "Our products are sold not only in the Uzbekistan market but also exported to Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan, Russia, and the UAE."
          - label: "Paragraph 2 (UZ)"
            name: "p2_uz"
            widget: "text"
            default: "Mahsulotlarimiz faqat O'zbekiston bozorida sotilmaydi, balki Qozog'iston, Qirg'iziston, Tojikiston, Turkmaniston, Rossiya va BAA ga eksport qilinadi."
          - label: "Paragraph 2 (RU)"
            name: "p2_ru"
            widget: "text"
            default: "Наша продукция продается не только на рынке Узбекистана, но и экспортируется в Казахстан, Кыргызстан, Таджикистан, Туркменистан, Россию и ОАЭ."
          - label: "Feature 1 Icon Image"
            name: "feature1_image"
            widget: "image"
            required: false
          - label: "Feature 1 Title (EN)"
            name: "feature1_title_en"
            widget: "string"
            default: "Modern Factory"
          - label: "Feature 1 Desc (EN)"
            name: "feature1_desc_en"
            widget: "string"
            default: "5000㎡ Production Facility"
          - label: "Feature 2 Icon Image"
            name: "feature2_image"
            widget: "image"
            required: false
          - label: "Feature 2 Title (EN)"
            name: "feature2_title_en"
            widget: "string"
            default: "Professional R&D Team"
          - label: "Feature 2 Desc (EN)"
            name: "feature2_desc_en"
            widget: "string"
            default: "Continuous Innovation"
          - label: "Feature 3 Icon Image"
            name: "feature3_image"
            widget: "image"
            required: false
          - label: "Feature 3 Title (EN)"
            name: "feature3_title_en"
            widget: "string"
            default: "OEM Service"
          - label: "Feature 3 Desc (EN)"
            name: "feature3_desc_en"
            widget: "string"
            default: "Custom Manufacturing"
          - label: "Feature 4 Icon Image"
            name: "feature4_image"
            widget: "image"
            required: false
          - label: "Feature 4 Title (EN)"
            name: "feature4_title_en"
            widget: "string"
            default: "Export Capability"
          - label: "Feature 4 Desc (EN)"
            name: "feature4_desc_en"
            widget: "string"
            default: "Covering 8 Countries"

  # ========== 4. PRODUCTS 板块 ==========
  - name: "products"
    label: "Products"
    label_singular: "Product"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product ID", name: "id", widget: "string" }
      - { label: "Product Name (EN)", name: "name_en", widget: "string" }
      - { label: "Product Name (UZ)", name: "name_uz", widget: "string" }
      - { label: "Product Name (RU)", name: "name_ru", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Classic Series", "Spicy Series", "Seafood Series", "Healthy Series", "Bulk Packaging"] }
      - { label: "Description (EN)", name: "description_en", widget: "text" }
      - { label: "Description (UZ)", name: "description_uz", widget: "text" }
      - { label: "Description (RU)", name: "description_ru", widget: "text" }
      - { label: "Weight", name: "weight", widget: "string", default: "85g" }
      - { label: "Shelf Life", name: "shelf_life", widget: "string", default: "12 months" }
      - { label: "Product Image", name: "image", widget: "image", required: false }
      - { label: "Badge Text", name: "badge", widget: "string", required: false, hint: "e.g., Best Seller, New, Hot" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  # ========== 5. QUALITY 板块 ==========
  - name: "quality_section"
    label: "Quality Section"
    label_singular: "Quality"
    files:
      - name: "quality_content"
        label: "Quality Content"
        file: "content/sections/quality.json"
        fields:
          - label: "Section Label (EN)"
            name: "label_en"
            widget: "string"
            default: "Production Quality"
          - label: "Title (EN)"
            name: "title_en"
            widget: "text"
            default: "Full Quality Control from Raw Materials to Finished Products"
          - label: "Title (UZ)"
            name: "title_uz"
            widget: "text"
            default: "Xom ashyodan tayyor mahsulotgacha to'liq sifat nazorati"
          - label: "Title (RU)"
            name: "title_ru"
            widget: "text"
            default: "Полный контроль качества от сырья до готовой продукции"
          - label: "Description (EN)"
            name: "desc_en"
            widget: "text"
            default: "We strictly follow international food safety standards to ensure every package is safe and reliable"
          - label: "Quality Card 1 Image"
            name: "card1_image"
            widget: "image"
            required: false
          - label: "Quality Card 1 Title (EN)"
            name: "card1_title_en"
            widget: "string"
            default: "Selected Raw Materials"
          - label: "Quality Card 1 Desc (EN)"
            name: "card1_desc_en"
            widget: "text"
            default: "Premium wheat flour and natural spices, quality control from source, all suppliers certified"
          - label: "Quality Card 2 Image"
            name: "card2_image"
            widget: "image"
            required: false
          - label: "Quality Card 2 Title (EN)"
            name: "card2_title_en"
            widget: "string"
            default: "Laboratory Testing"
          - label: "Quality Card 2 Desc (EN)"
            name: "card2_desc_en"
            widget: "text"
            default: "Professional food testing laboratory, each batch undergoes physical-chemical and microbiological testing"
          - label: "Quality Card 3 Image"
            name: "card3_image"
            widget: "image"
            required: false
          - label: "Quality Card 3 Title (EN)"
            name: "card3_title_en"
            widget: "string"
            default: "Automated Production"
          - label: "Quality Card 3 Desc (EN)"
            name: "card3_desc_en"
            widget: "text"
            default: "Fully automatic production lines, minimized human contact, ensuring production hygiene and consistency"
          - label: "Certifications"
            name: "certifications"
            widget: "list"
            fields:
              - { label: "Cert Name", name: "name", widget: "string" }
              - { label: "Cert Code", name: "code", widget: "string" }

  # ========== 6. B2B 板块 ==========
  - name: "b2b_section"
    label: "B2B Section"
    label_singular: "B2B"
    files:
      - name: "b2b_content"
        label: "B2B Content"
        file: "content/sections/b2b.json"
        fields:
          - label: "Title (EN)"
            name: "title_en"
            widget: "text"
            default: "B2B Partnership Opportunities"
          - label: "Title (UZ)"
            name: "title_uz"
            widget: "text"
            default: "B2B Hamkorlik Imkoniyatlari"
          - label: "Title (RU)"
            name: "title_ru"
            widget: "text"
            default: "Возможности B2B сотрудничества"
          - label: "Intro (EN)"
            name: "intro_en"
            widget: "text"
            default: "We welcome distributors, retailers, and exporters to establish long-term partnerships. Whether local procurement or international import, we provide flexible cooperation solutions."
          - label: "Benefit 1 Image"
            name: "benefit1_image"
            widget: "image"
            required: false
          - label: "Benefit 1 Title (EN)"
            name: "benefit1_title_en"
            widget: "string"
            default: "Flexible MOQ"
          - label: "Benefit 1 Desc (EN)"
            name: "benefit1_desc_en"
            widget: "text"
            default: "Starting from 100 boxes, small batch trial orders available to reduce your inventory pressure"
          - label: "Benefit 2 Image"
            name: "benefit2_image"
            widget: "image"
            required: false
          - label: "Benefit 2 Title (EN)"
            name: "benefit2_title_en"
            widget: "string"
            default: "OEM Service"
          - label: "Benefit 2 Desc (EN)"
            name: "benefit2_desc_en"
            widget: "text"
            default: "Custom brand manufacturing, from packaging design to flavor development, one-stop service"
          - label: "Benefit 3 Image"
            name: "benefit3_image"
            widget: "image"
            required: false
          - label: "Benefit 3 Title (EN)"
            name: "benefit3_title_en"
            widget: "string"
            default: "Export Support"
          - label: "Benefit 3 Desc (EN)"
            name: "benefit3_desc_en"
            widget: "text"
            default: "Complete export documentation, customs clearance assistance, exported to 8 countries"
          - label: "Benefit 4 Image"
            name: "benefit4_image"
            widget: "image"
            required: false
          - label: "Benefit 4 Title (EN)"
            name: "benefit4_title_en"
            widget: "string"
            default: "Competitive Pricing"
          - label: "Benefit 4 Desc (EN)"
            name: "benefit4_desc_en"
            widget: "text"
            default: "Direct from factory, no intermediaries, ensuring best prices for you"
          - label: "Form Title (EN)"
            name: "form_title_en"
            widget: "string"
            default: "Get a Quote"
          - label: "Download Button (EN)"
            name: "download_en"
            widget: "string"
            default: "Download Product Catalog (PDF)"

  # ========== 7. CONTACT 板块 ==========
  - name: "contact_section"
    label: "Contact Section"
    label_singular: "Contact"
    files:
      - name: "contact_content"
        label: "Contact Content"
        file: "content/sections/contact.json"
        fields:
          - label: "Section Label (EN)"
            name: "label_en"
            widget: "string"
            default: "Contact"
          - label: "Title (EN)"
            name: "title_en"
            widget: "text"
            default: "Looking Forward to Partnering with You"
          - label: "Title (UZ)"
            name: "title_uz"
            widget: "text"
            default: "Siz bilan hamkorlik qilishni umid qilamiz"
          - label: "Title (RU)"
            name: "title_ru"
            widget: "text"
            default: "С нетерпением ждем сотрудничества с вами"
          - label: "Description (EN)"
            name: "desc_en"
            widget: "text"
            default: "For any questions or partnership inquiries, feel free to contact us"
          - label: "Contact 1 Icon Image"
            name: "contact1_image"
            widget: "image"
            required: false
          - label: "Contact 1 Title (EN)"
            name: "contact1_title_en"
            widget: "string"
            default: "Factory Address"
          - label: "Contact 1 Content (EN)"
            name: "contact1_content_en"
            widget: "text"
            default: "Tashkent, Uzbekistan<br>Yangi Hayot District<br>Industrial Street 15"
          - label: "Contact 2 Icon Image"
            name: "contact2_image"
            widget: "image"
            required: false
          - label: "Contact 2 Title (EN)"
            name: "contact2_title_en"
            widget: "string"
            default: "Contact Information"
          - label: "Phone"
            name: "phone"
            widget: "string"
            default: "+998 71 234 56 78"
          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
            default: "+998 90 123 45 67"
          - label: "Email"
            name: "email"
            widget: "string"
            default: "info@noodleuz.uz"
          - label: "Contact 3 Icon Image"
            name: "contact3_image"
            widget: "image"
            required: false
          - label: "Contact 3 Title (EN)"
            name: "contact3_title_en"
            widget: "string"
            default: "Business Hours"
          - label: "Business Hours (EN)"
            name: "hours_en"
            widget: "text"
            default: "Mon-Fri: 09:00 - 18:00<br>Sat: 09:00 - 14:00<br>Sun: Closed"
          - label: "Business Hours (UZ)"
            name: "hours_uz"
            widget: "text"
            default: "Dushanba - Juma: 09:00 - 18:00<br>Shanba: 09:00 - 14:00<br>Yakshanba: Dam olish"
          - label: "Business Hours (RU)"
            name: "hours_ru"
            widget: "text"
            default: "Пн-Пт: 09:00 - 18:00<br>Сб: 09:00 - 14:00<br>Вс: Выходной"

  # ========== 8. FOOTER 板块 ==========
  - name: "footer_section"
    label: "Footer"
    label_singular: "Footer"
    files:
      - name: "footer_content"
        label: "Footer Content"
        file: "content/sections/footer.json"
        fields:
          - label: "Footer Description (EN)"
            name: "desc_en"
            widget: "text"
            default: "Premium noodle manufacturer in Uzbekistan, dedicated to providing safe, delicious, and convenient instant food products for the Central Asian market."
          - label: "Footer Description (UZ)"
            name: "desc_uz"
            widget: "text"
            default: "O'zbekistonda premium la'mon ishlab chiqaruvchisi, Markaziy Osiyo bozori uchun xavfsiz, mazali va qulay tez tayyorlanadigan oziq-ovqat mahsulotlarini taqdim etishga bag'ishlangan."
          - label: "Footer Description (RU)"
            name: "desc_ru"
            widget: "text"
            default: "Производитель премиальной лапши в Узбекистане, посвятивший себя обеспечению безопасных, вкусных и удобных продуктов быстрого приготовления для рынка Центральной Азии."
          - label: "Footer Bottom Text (EN)"
            name: "bottom_en"
            widget: "string"
            default: "Tashkent, Uzbekistan | HALAL Certified Products"
          - label: "Column 1 Title (EN)"
            name: "col1_title_en"
            widget: "string"
            default: "Quick Links"
          - label: "Column 2 Title (EN)"
            name: "col2_title_en"
            widget: "string"
            default: "Product Series"
          - label: "Column 3 Title (EN)"
            name: "col3_title_en"
            widget: "string"
            default: "Partnership"
          - label: "Social Media"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Telegram URL", name: "telegram", widget: "string", required: false }
              - { label: "WhatsApp Number", name: "whatsapp", widget: "string", required: false }

  # ========== 9. 认证资质 ==========
  - name: "certifications"
    label: "Certifications"
    folder: "content/certifications"
    create: true
    fields:
      - { label: "Certification Name", name: "name", widget: "string" }
      - { label: "Short Code", name: "code", widget: "string", hint: "e.g., HALAL, ISO 22000" }
      - { label: "Description (EN)", name: "description_en", widget: "text" }
      - { label: "Description (UZ)", name: "description_uz", widget: "text" }
      - { label: "Description (RU)", name: "description_ru", widget: "text" }
      - { label: "Certificate Image", name: "image", widget: "image" }
      - { label: "Valid Until", name: "valid_until", widget: "datetime" }

  # ========== 10. 新闻动态 ==========
  - name: "news"
    label: "News & Updates"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title (EN)", name: "title_en", widget: "string" }
      - { label: "Title (UZ)", name: "title_uz", widget: "string" }
      - { label: "Title (RU)", name: "title_ru", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Excerpt (EN)", name: "excerpt_en", widget: "text" }
      - { label: "Excerpt (UZ)", name: "excerpt_uz", widget: "text" }
      - { label: "Excerpt (RU)", name: "excerpt_ru", widget: "text" }
      - { label: "Body (EN)", name: "body_en", widget: "markdown" }
      - { label: "Body (UZ)", name: "body_uz", widget: "markdown" }
      - { label: "Body (RU)", name: "body_ru", widget: "markdown" }
      - { label: "Tags", name: "tags", widget: "list", default: ["news"] }
