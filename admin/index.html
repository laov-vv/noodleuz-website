<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoodleUz Content Manager</title>
    
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.1.0/dist/decap-cms.js"></script>
    
    <!-- 自定义样式 -->
    <style>
        :root {
            --primary-color: #E85D04;
        }
        
        .nc-appHeader-siteName {
            font-weight: 800 !important;
        }
        
        .nc-entryEditor-toolbar-saveButton,
        .nc-entryEditor-toolbar-publishButton {
            background-color: var(--primary-color) !important;
        }

        /* 加载动画 */
        #cms-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #666;
            font-size: 16px;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e85d0420;
            border-top-color: #E85D04;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- CMS 渲染容器（必须存在） -->
    <div id="cms">
        <div id="cms-loading">
            <div class="spinner"></div>
            Loading Content Manager...
        </div>
    </div>

    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        // Netlify Identity 重定向处理
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
